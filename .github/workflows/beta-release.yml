name: Publish beta
run-name: MG4Link ${{ inputs.version }} (${{ inputs.dry_run && 'dry run' || 'publish' }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version, for example 2.2.7-beta33'
        required: true
        type: string
      notes:
        description: 'Release notes (Markdown)'
        required: true
        type: string
      dry_run:
        description: 'Build, test and verify without pushing or publishing'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  beta:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android packages
        run: bash scripts/ci_android_sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare beta version
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          python3 scripts/ci_version.py --prepare-beta "$VERSION"
          python3 scripts/check_localization.py
          test -n "${NOTES//[[:space:]]/}" || { echo 'Release notes are required'; exit 1; }
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$GITHUB_SHA" &&
              git diff --quiet -- app/build.gradle.kts ||
              { echo 'Version tag already points to another build'; exit 1; }
          fi
      - name: Build, test and lint the car release
        run: ./gradlew :app:testCarDebugUnitTest :app:assembleCarRelease :app:lintCarRelease --stacktrace
      - name: Validation summary
        if: always()
        run: python3 scripts/ci_summary.py --require-tests --lint carRelease
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-validation
          path: |
            app/build/reports/tests/testCarDebugUnitTest
            app/build/test-results/testCarDebugUnitTest
            app/build/reports/lint-results-carRelease.*
          retention-days: 14
      - name: Sign and verify APK
        env:
          MG4LINK_PLATFORM_KEY_BASE64: ${{ secrets.MG4LINK_PLATFORM_KEY_BASE64 }}
        run: |
          test -n "$MG4LINK_PLATFORM_KEY_BASE64" || { echo 'Missing MG4Link beta signing input'; exit 1; }
          bash scripts/sign_car_apk.sh "$VERSION"
      - name: Upload signed APK for review
        uses: actions/upload-artifact@v4
        with:
          name: beta-apk
          path: |
            MG4Link_*.apk
            MG4Link_*.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Attest signed APK
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: MG4Link_${{ inputs.version }}.apk
      - name: Commit the version and publish the beta
        if: ${{ !inputs.dry_run }}
        run: bash scripts/publish_beta.sh "$VERSION"
