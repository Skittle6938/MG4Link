name: Release

# Builds the published car APK from the tagged source, on GitHub's runners, so anyone
# can check that a download is exactly what this repository's code produces:
#
#   gh attestation verify MG4Link_<version>.apk --repo Skittle6938/MG4Link
#
# Push a tag equal to versionName with a "v" in front (v2.2.8, v2.2.8-beta1). A version
# with a "-" in it is published as a pre-release, so only beta-enabled cars are offered
# it; anything else is a stable release.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/check_localization.py'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the signed car APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the version and verify release tags
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::invalid versionName in app/build.gradle.kts"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag && "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android packages
        run: bash scripts/ci_android_sdk.sh

      - name: Check core translations
        run: python3 scripts/check_localization.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and carRelease
        run: ./gradlew :app:testCarDebugUnitTest :app:assembleCarRelease --stacktrace

      - name: Sign, verify and checksum
        run: bash scripts/sign_car_apk.sh "$VERSION"
      - name: Upload the signed APK for verification
        uses: actions/upload-artifact@v4
        with:
          name: signed-car-release
          path: |
            MG4Link_*.apk
            MG4Link_*.apk.sha256
          if-no-files-found: error

  publish:
    name: Attest and publish a tagged build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the verified build
        uses: actions/download-artifact@v4
        with:
          name: signed-car-release

      - name: Verify the artifact checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="MG4Link_${VERSION}.apk"
          sha256sum -c "$APK.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.APK }}

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag $PRE --title "MG4Link $VERSION" \
            --notes "Built from $GITHUB_SHA by the Release workflow. Changes: see CHANGELOG.md. Verify: gh attestation verify $APK --repo $GITHUB_REPOSITORY"
