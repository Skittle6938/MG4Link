name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]

# Cancel superseded runs on the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only; this workflow needs no write scopes and touches no secrets,
# so it runs unchanged on pull requests opened from forks.
permissions:
  contents: read

jobs:
  build:
    name: Build (github debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android packages
        run: bash scripts/ci_android_sdk.sh

      - name: Check version progression
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_version.py --base "$BASE_SHA"

      - name: Check translations
        run: python3 scripts/check_localization.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble car debug + release and phone debug APKs
        run: ./gradlew :app:assembleCarDebug :app:assembleCarRelease :app:assemblePhoneDebug --stacktrace

      - name: APK size summary
        if: always()
        run: python3 scripts/ci_summary.py

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diauto-review-apk
          path: |
            app/build/outputs/apk/car/debug/*.apk
            app/build/outputs/apk/phone/debug/*.apk
          if-no-files-found: warn

  unit-test:
    name: Unit tests (car debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android packages
        run: bash scripts/ci_android_sdk.sh

      - name: Check core translations
        run: python3 scripts/check_localization.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testCarDebugUnitTest --stacktrace

      - name: Report Android lint findings
        run: ./gradlew :app:lintCarDebug --stacktrace

      - name: Upload the full lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-carDebug.*
          if-no-files-found: ignore

      - name: Test and full lint summary
        if: always()
        run: python3 scripts/ci_summary.py --require-tests --lint carDebug

      - name: Check API, thread and resource correctness
        run: ./gradlew :app:lintCarDebug -Pmg4link.strictLint=true --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testCarDebugUnitTest
            app/build/test-results/testCarDebugUnitTest
          if-no-files-found: warn
