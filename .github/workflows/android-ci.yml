name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]

# Cancel superseded runs on the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only; this workflow needs no write scopes and touches no secrets,
# so it runs unchanged on pull requests opened from forks.
permissions:
  contents: read

jobs:
  build:
    name: Build (github debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # NDK/CMake versions are pinned in app/build.gradle.kts; install the
      # exact versions rather than relying on whatever the runner ships.
      # Retried because sdkmanager downloads occasionally arrive corrupt
      # ("Error on ZipFile unknown archive") on GitHub-hosted runners.
      - name: Install pinned NDK and CMake
        run: |
          for attempt in 1 2 3; do
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Check core translations
        run: python3 scripts/check_localization.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble car debug + release and phone debug APKs
        run: ./gradlew :app:testCarDebugUnitTest :app:assembleCarDebug :app:assembleCarRelease :app:assemblePhoneDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diauto-review-apk
          path: |
            app/build/outputs/apk/car/debug/*.apk
            app/build/outputs/apk/phone/debug/*.apk
          if-no-files-found: warn

  unit-test:
    name: Unit tests (car debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # See the build job for why NDK/CMake are pinned and the install is retried.
      - name: Install pinned NDK and CMake
        run: |
          for attempt in 1 2 3; do
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Check core translations
        run: python3 scripts/check_localization.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testCarDebugUnitTest --stacktrace

      - name: Report Android lint findings
        run: ./gradlew :app:lintCarDebug --stacktrace

      - name: Upload the full lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-carDebug.html
          if-no-files-found: ignore

      - name: Check API, thread and resource correctness
        run: ./gradlew :app:lintCarDebug -Pmg4link.strictLint=true --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testCarDebugUnitTest
            app/build/test-results/testCarDebugUnitTest
          if-no-files-found: warn
